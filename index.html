<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JLaw 報告中心</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1a1d23;--mute:#6b7280;--line:#e3e6eb;--brand:#0f766e;--wa:#25d366;--sel:#e6f4f1}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--ink:#e8eaee;--mute:#99a1ad;--line:#2a2f38;--brand:#2dd4bf;--sel:#12302c}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"PingFang HK","Noto Sans TC",sans-serif;padding-bottom:90px}
  header{padding:20px 16px 8px;max-width:900px;margin:0 auto}
  h1{margin:0;font-size:22px}
  header p{margin:4px 0 0;color:var(--mute);font-size:13px}
  header a{color:var(--brand)}
  #sync{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:3px 10px;font:inherit;cursor:pointer}
  #sync:disabled{opacity:.5}
  .wrap{max-width:900px;margin:0 auto;padding:0 16px}
  .tabs,.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
  .tabs button,.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer}
  .tabs button.on,.chips button.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .tools{display:flex;gap:8px;margin:4px 0 8px}
  .tools input[type=search]{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
  .tools button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:0 12px;font:inherit;cursor:pointer;white-space:nowrap}
  .group h2{font-size:13px;color:var(--mute);margin:16px 0 6px;font-weight:600}
  .item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px}
  .item.sel{background:var(--sel);border-color:var(--brand)}
  .item input{width:20px;height:20px;flex:none;accent-color:var(--brand)}
  .item .t{flex:1;min-width:0;cursor:pointer}
  .item .n{font-weight:600;word-break:break-all}
  .item .m{font-size:12px;color:var(--mute)}
  .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:var(--line);margin-right:4px}
  .up{margin-left:2px}
  .open{flex:none;color:var(--brand);text-decoration:none;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:5px 10px}
  .empty{text-align:center;color:var(--mute);padding:40px 0}
  #bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:none}
  #bar.show{display:block}
  #bar .in{max-width:900px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  #bar .cnt{flex:1;min-width:90px;font-weight:600}
  #bar input{width:150px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  #bar button{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}
  #wa{background:var(--wa);color:#073b1a}
  #pdf{background:var(--brand);color:#fff}
  #pdf:disabled{opacity:.5}
  #cp,#clr{background:var(--line);color:var(--ink)}
  #adm{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:3px 10px;font:inherit;cursor:pointer}
  #adm.on{background:var(--brand);border-color:var(--brand);color:#fff}
  #up,#gconn{display:none;margin-left:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:3px 10px;font:inherit;cursor:pointer}
  #upcat{display:none;margin-left:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:3px 6px;font:inherit}
  #showHid{display:none;margin-left:6px;font-size:13px}
  #hide,#del{display:none}
  #hide{background:var(--line);color:var(--ink)}
  #del{background:#dc2626;color:#fff}
  .item.hid{opacity:.55}
  #cov h3{font-size:15px;margin:14px 0 6px}
  #cov .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
  #cov select,#cov input[type=date],#cov button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 9px;font:inherit}
  #cov button.on{background:var(--brand);border-color:var(--brand);color:#fff}
  #cov .sum{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
  #cov table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px}
  #cov th,#cov td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center}
  #cov th:first-child,#cov td:first-child{text-align:left}
  #cov .tk{font-weight:700} #cov .co{font-size:11px;color:var(--mute)} #cov .ok{color:#16a34a} #cov .no{color:#dc2626;font-weight:700}
  #cov .note{font-size:12px;color:var(--mute);margin:6px 0}
  #toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;display:none}
</style>
</head>
<body>
<header>
  <h1>JLaw 報告中心</h1>
  <p>共 <span id="total"></span> 份報告 · 撳標題打開 PDF · 剔選後可直接 WhatsApp 分享 ·
    <a id="f1" target="_blank" rel="noopener">Drive 資料夾 1</a> / <a id="f2" target="_blank" rel="noopener">2</a>
    · <button id="sync" type="button">🔄 同步 Drive</button> <span id="syncAt"></span>
    · <button id="adm" type="button">🔒 管理</button><label id="showHid"><input type="checkbox" id="showHidCb"> 顯示已隱藏</label>
    <button id="gconn" type="button">🔗 連接 Google</button>
    <select id="upcat" aria-label="上傳類型"><option value="auto">自動判斷類型</option><option value="market">美股大盤</option><option value="daily">每日跨股總表</option><option value="stock">個股研究報告</option><option value="card">行動卡</option><option value="verify">核實報告</option></select>
    <button id="up" type="button">⬆ 上傳報告</button><input type="file" id="upfile" accept="application/pdf,.pdf" multiple hidden></p>
</header>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div class="chips" id="chips"></div>
  <div class="tools">
    <input type="search" id="q" placeholder="搜尋（股票代號、日期、報告類型…）">
    <button id="selAll">全選當前</button>
  </div>
  <div id="list"></div>
  <div id="cov" style="display:none"></div>
</div>

<div id="bar"><div class="in">
  <span class="cnt" id="cnt"></span>
  <input id="phone" type="tel" inputmode="tel" placeholder="電話（選填，如 85291234567）">
  <button id="clr">清除</button>
  <button id="hide">隱藏</button>
  <button id="del">🗑 Drive 刪除</button>
  <button id="cp">複製訊息</button>
  <button id="pdf" style="display:none">分享 PDF 檔案</button>
  <button id="wa">WhatsApp 連結</button>
</div></div>
<div id="toast"></div>

<script src="data.js"></script>
<script>
const CATS = {market:"美股大盤", daily:"每日跨股總表", stock:"個股研究", card:"行動卡", verify:"核實報告", other:"其他"};
const link = id => "https://drive.google.com/file/d/" + id + "/view";
const hkFmt = new Intl.DateTimeFormat("zh-HK", {timeZone:"Asia/Hong_Kong", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hour12:false});
const hkTime = iso => { const o = Object.fromEntries(hkFmt.formatToParts(new Date(iso)).map(x => [x.type, x.value])); return o.month + "-" + o.day + " " + (o.hour==="24"?"00":o.hour) + ":" + o.minute; };
const toItems = rows => rows.map(([cat,id,name,up]) => {
  const dm = name.match(/\d{4}-\d{2}-\d{2}/) || name.match(/(?<!\d)20\d{6}(?!\d)/);
  const date = dm ? (dm[0].includes("-") ? dm[0] : dm[0].replace(/^(\d{4})(\d{2})(\d{2})$/, "$1-$2-$3")) : "";
  const rest = name.replace(dm ? dm[0] : "", "").replace(/\s+_+/, " ").replace(/([-_\s])[-_\s]+/g, "$1").replace(/^[\s_-]+|[\s_-]+$/g, "");   // 例：「[舊版備份] DE_行動卡」
  const tk = name.split(/[_\s-]+/).find(t => /^[A-Z]{1,5}$/.test(t)) || "";
  return {cat, id, name, up, date, title:rest || name, ticker:tk, url:link(id)};
}).sort((a,b) => b.date.localeCompare(a.date) || a.name.localeCompare(b.name));
let items = toItems(window.REPORTS);

const $ = s => document.querySelector(s);
const state = {cat:"all", ticker:"all", q:"", sel:new Set(), hidden:new Set(), deleted:new Set(), showHidden:false, pw:"", canDelete:false, canUpload:false, googleReady:false, googleConnected:false};
try { const s = JSON.parse(localStorage.getItem("jlaw-sel")||"[]"); s.forEach(i => state.sel.add(i)); $("#phone").value = localStorage.getItem("jlaw-phone")||""; } catch(e){}

const shown = () => items.filter(r => !state.deleted.has(r.id) && !state.hidden.has(r.id));
const updTotal = () => { $("#total").textContent = shown().length; };
updTotal();
$("#f1").href = window.FOLDERS[0]; $("#f2").href = window.FOLDERS[1];

function visible(){
  const q = state.q.trim().toLowerCase();
  return items.filter(r =>
    !state.deleted.has(r.id) && (state.showHidden || !state.hidden.has(r.id)) &&
    (state.cat==="all" || state.cat==="new" || r.cat===state.cat) &&
    (state.ticker==="all" || r.ticker===state.ticker) &&
    (!q || (r.name+" "+CATS[r.cat]).toLowerCase().includes(q)));
}
function btns(el, entries, key){
  el.innerHTML = "";
  entries.forEach(([v,label]) => {
    const b = document.createElement("button");
    b.textContent = label; if(state[key]===v) b.className = "on";
    b.onclick = async () => { if(v === "cov" && !state.pw){ await doUnlock(); if(!state.pw) return; } state[key]=v; render(); if(v === "cov") loadSheet(false); };
    el.appendChild(b);
  });
}
function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(){
  btns($("#tabs"), [["all","全部"], ["new","🆕 最新上傳"], ...Object.entries(CATS), ["cov","✅ 覆蓋檢查"]], "cat");
  const isCov = state.cat === "cov";
  $("#cov").style.display = isCov ? "" : "none"; $("#list").style.display = isCov ? "none" : ""; document.querySelector(".tools").style.display = isCov ? "none" : "";
  if(isCov){ $("#chips").style.display = "none"; renderCov(); updateBar(); return; }
  const tickers = [...new Set(items.filter(r => !state.deleted.has(r.id) && (state.showHidden || !state.hidden.has(r.id)) && (state.cat==="all" || state.cat==="new" || r.cat===state.cat)).map(r=>r.ticker).filter(Boolean))].sort();
  if(state.ticker!=="all" && !tickers.includes(state.ticker)) state.ticker="all";
  btns($("#chips"), [["all","所有股票"], ...tickers.map(t=>[t,t])], "ticker");
  $("#chips").style.display = tickers.length ? "" : "none";

  let rows = visible(), byDate = {};
  if(state.cat === "new"){   // 按上傳時間（新→舊）列出最近 20 份，標題帶報告日期
    rows = rows.slice().sort((a,b) => b.up.localeCompare(a.up)).slice(0,20);
    rows.forEach(r => (byDate["最近上傳（按上傳時間，新→舊）"] ||= []).push(r));
  } else rows.forEach(r => (byDate[r.date] ||= []).push(r));
  const order = state.cat === "new" ? Object.keys(byDate) : Object.keys(byDate).sort().reverse();
  $("#list").innerHTML = rows.length ? order.map(d =>
    `<div class="group"><h2>${d}</h2>` + byDate[d].map(r =>
      `<div class="item${state.sel.has(r.id)?" sel":""}${state.hidden.has(r.id)?" hid":""}" data-id="${r.id}">
        <input type="checkbox" ${state.sel.has(r.id)?"checked":""} aria-label="選取 ${esc(r.name)}">
        <div class="t"><div class="n">${state.cat==="new" ? esc(r.date + " ") : ""}${esc(r.title)}</div>
          <div class="m"><span class="tag">${CATS[r.cat]}</span>${state.hidden.has(r.id)?`<span class="tag">已隱藏</span>`:""}${r.ticker?`<span class="tag">${r.ticker}</span>`:""}<span class="up">上傳 ${hkTime(r.up)}（HKT）</span></div></div>
        <a class="open" href="${r.url}" target="_blank" rel="noopener">打開</a>
      </div>`).join("") + `</div>`).join("") : `<div class="empty">搵唔到相關報告</div>`;
  updateBar();
}

$("#list").addEventListener("click", e => {
  if(e.target.closest("a")) return;
  const el = e.target.closest(".item"); if(!el) return;
  toggle(el.dataset.id);
});
function toggle(id){ state.sel.has(id) ? state.sel.delete(id) : state.sel.add(id); persist(); render(); }
function persist(){ try{ localStorage.setItem("jlaw-sel", JSON.stringify([...state.sel])); }catch(e){} }

$("#q").oninput = e => { state.q = e.target.value; render(); };
$("#selAll").onclick = () => {
  const rows = visible(), all = rows.every(r => state.sel.has(r.id));
  rows.forEach(r => all ? state.sel.delete(r.id) : state.sel.add(r.id));
  persist(); render();
};
$("#clr").onclick = () => { state.sel.clear(); persist(); render(); };
$("#phone").onchange = e => { try{ localStorage.setItem("jlaw-phone", e.target.value); }catch(_){} };

function selected(){ return items.filter(r => state.sel.has(r.id) && !state.deleted.has(r.id)); }
function message(){
  const rows = selected();
  return rows.map(r => r.name + "\n" + r.url).join("\n\n");
}
function updateBar(){
  const n = state.sel.size;
  $("#bar").classList.toggle("show", n>0);
  $("#cnt").textContent = "已選 " + n + " 份";
  const adm = !!state.pw;
  $("#hide").style.display = adm ? "inline-block" : "none"; $("#del").style.display = adm && state.canDelete ? "inline-block" : "none";
  $("#hide").textContent = n && selected().every(r => state.hidden.has(r.id)) ? "還原" : "隱藏";
  if(n) refreshPdfBtn();
}
function toast(t){ const el=$("#toast"); el.textContent=t; el.style.display="block"; setTimeout(()=>el.style.display="none", Math.max(1800, t.length*120)); }

$("#wa").onclick = () => {
  const phone = $("#phone").value.replace(/\D/g,"");
  const base = phone ? "https://wa.me/" + phone : "https://wa.me/";
  window.open(base + "?text=" + encodeURIComponent(message()), "_blank", "noopener");
};
$("#cp").onclick = async () => {
  try { await navigator.clipboard.writeText(message()); toast("已複製"); } catch(e){ toast("複製失敗"); }
};

// ---- 直接分享 PDF 檔案（手機瀏覽器 Web Share API）----
// 揀選時預先下載，確保撳掣時可即時 share（iOS 要求喺撳掣當下呼叫）
const files = new Map();
function canShareFiles(){
  try { return !!navigator.canShare && navigator.canShare({files:[new File(["x"],"x.pdf",{type:"application/pdf"})]}); } catch(e){ return false; }
}
const fileShare = canShareFiles();
function prefetch(){
  if(!fileShare) return;
  selected().forEach(r => {
    if(files.has(r.id)) return;
    files.set(r.id, fetch("/pdf/" + r.id).then(x => { if(!x.ok) throw 0; return x.blob(); })
      .then(b => new File([b], r.name + ".pdf", {type:"application/pdf"}))
      .catch(() => { files.delete(r.id); return null; }));
  });
}
const readyFiles = () => selected().map(r => files.get(r.id)).filter(Boolean);
async function refreshPdfBtn(){
  const b = $("#pdf"); if(!fileShare){ b.style.display="none"; return; }
  b.style.display = ""; prefetch();
  const n = state.sel.size, done = await Promise.all(selected().map(r => files.get(r.id)));
  const loaded = done.filter(Boolean).length;
  b.disabled = loaded < n; b.textContent = loaded < n ? "準備 PDF… " + loaded + "/" + n : "分享 PDF 檔案";
  if(loaded < n && state.sel.size === n) setTimeout(refreshPdfBtn, 500);
}
$("#pdf").onclick = async () => {
  const list = await Promise.all(selected().map(r => files.get(r.id)));
  const fs_ = list.filter(Boolean);
  if(!fs_.length) return toast("PDF 未準備好");
  try { await navigator.share({files: fs_}); }
  catch(e){ if(e.name !== "AbortError") toast("分享失敗，請改用連結"); }
};
render();
// ---- 同步 Drive ----
async function syncDrive(manual){
  const b = $("#sync"); b.disabled = true; b.textContent = "同步中…";
  try {
    const r = await fetch("/api/sync"); const j = await r.json();
    if(!r.ok) throw new Error(r.status === 503 ? "未設定 DRIVE_API_KEY" : (j.error || r.status));
    const before = new Set(items.map(x => x.id));
    items = toItems(j.rows);
    const added = items.filter(x => !before.has(x.id) && !state.deleted.has(x.id)).length, removed = [...before].filter(id => !items.some(x => x.id === id)).length;
    [...state.sel].forEach(id => { if(!items.some(x => x.id === id)) state.sel.delete(id); });
    updTotal(); persist(); render();
    $("#syncAt").textContent = "最後同步 " + hkTime(new Date().toISOString()).slice(6) + " HKT";
    if(manual) toast(added || removed ? "新增 " + added + " 份" + (removed ? "，移除 " + removed + " 份" : "") : "已係最新");
  } catch(e){ if(manual) toast("同步失敗：" + e.message); }
  finally { b.disabled = false; b.textContent = "🔄 同步 Drive"; }
}
$("#sync").onclick = () => syncDrive(true);
syncDrive(false);
// ---- 管理：隱藏 / 刪除（需密碼）----
async function api(path, payload){
  const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json", "x-admin-password":state.pw}, body:JSON.stringify(payload||{})});
  const j = await r.json().catch(() => ({}));
  if(r.status === 401){ lock(); throw new Error("密碼錯誤，已退出管理"); }
  return {ok:r.ok, status:r.status, j};
}
function applyVis(j){ state.hidden = new Set(j.hidden||[]); state.deleted = new Set(j.deleted||[]); [...state.sel].forEach(i => { if(state.deleted.has(i)) state.sel.delete(i); }); updTotal(); persist(); render(); }
function lock(){ if(state.cat === "cov") state.cat = "all"; state.pw = ""; try{ sessionStorage.removeItem("jlaw-pw"); }catch(e){} state.showHidden = false; $("#showHidCb").checked = false; adminUi(); render(); }
function adminUi(){
  const on = !!state.pw;
  $("#adm").textContent = on ? "🔓 管理中（退出）" : "🔒 管理"; $("#adm").classList.toggle("on", on);
  $("#showHid").style.display = on ? "inline" : "none";
  $("#up").style.display = on && state.canUpload ? "inline-block" : "none";
  $("#upcat").style.display = on && state.canUpload ? "inline-block" : "none";
  $("#gconn").style.display = on && state.googleReady && !state.googleConnected ? "inline-block" : "none";
}
$("#adm").onclick = async () => { if(state.pw) return lock(); await doUnlock(); };
async function doUnlock(){
  const pw = prompt("請輸入管理密碼"); if(!pw) return;
  state.pw = pw;
  try {
    const r = await api("/api/auth");
    if(!r.ok) throw new Error(r.status === 503 ? "未設定 ADMIN_PASSWORD" : (r.j.error || "密碼錯誤"));
    try{ sessionStorage.setItem("jlaw-pw", pw); }catch(e){}
    adminUi(); render(); toast("已進入管理模式");
  } catch(e){ state.pw = ""; adminUi(); toast(e.message); }
}
$("#showHidCb").onchange = e => { state.showHidden = e.target.checked; render(); };
$("#hide").onclick = async () => {
  const rows = selected(), restore = rows.every(r => state.hidden.has(r.id));
  try {
    const r = await api("/api/hide", {ids:rows.map(x => x.id), hidden:!restore});
    if(!r.ok) throw new Error(r.j.error || r.status);
    if(!restore) state.sel.clear();
    applyVis(r.j); toast(restore ? "已還原 " + rows.length + " 份" : "已隱藏 " + rows.length + " 份");
  } catch(e){ toast("失敗：" + e.message); }
};
$("#del").onclick = async () => {
  const rows = selected(); if(!rows.length) return;
  const list = rows.slice(0,6).map(r => "• " + r.name).join("\n") + (rows.length > 6 ? "\n…等共 " + rows.length + " 份" : "");
  if(!confirm("確定將以下 " + rows.length + " 份報告移到 Google Drive 垃圾桶？\n\n" + list + "\n\n其他人嘅連結會即時失效，30 日內可喺 Drive 垃圾桶還原。")) return;
  try {
    const r = await api("/api/delete", {ids:rows.map(x => x.id)});
    if(r.status === 503) throw new Error(r.j.failed && r.j.failed[0] ? r.j.failed[0].error : (r.j.error || "未設定"));
    const done = (r.j.done||[]).length, failed = r.j.failed||[];
    if(r.j.hidden) applyVis(r.j);
    toast(failed.length ? "已刪除 " + done + " 份，" + failed.length + " 份失敗：" + failed[0].error : "已刪除 " + done + " 份");
  } catch(e){ toast("刪除失敗：" + e.message); }
};

// ---- 連接 Google / 上傳報告 ----
$("#gconn").onclick = async () => {
  try {

$("#up").onclick = () => $("#upfile").click();
$("#upfile").onchange = async e => {
  const list = [...e.target.files]; e.target.value = "";
  if(!list.length) return;
  const cat = $("#upcat").value; let ok = 0, fail = [], skipped = 0;
  await syncDrive(false);   // 先同步一次，確保重複檢查用嘅係最新清單
  const norm = s => s.replace(/\.pdf$/i, "").trim().toLowerCase();
  const seen = new Set();   // 今次一齊揀嘅檔案之間都檢查重複
  for(let i = 0; i < list.length; i++){
    const f = list[i];
    try {
      if(!/\.pdf$/i.test(f.name)) throw new Error("唔係 PDF");
      const same = items.find(x => !state.deleted.has(x.id) && norm(x.name) === norm(f.name));
      if(same || seen.has(norm(f.name))){
        const when = same ? "（已於 " + hkTime(same.up) + " HKT 上傳" + (state.hidden.has(same.id) ? "，目前已隱藏" : "") + "）" : "（今次一齊揀咗兩份同名檔案）";
        if(!confirm("⚠ 重複上傳\n\n「" + f.name + "」已經存在" + when + "。\n\n繼續上傳嘅話 Drive 會有兩份同名檔案（網頁只會顯示較新嗰份）。\n\n要繼續上傳嗎？\n（取消 = 跳過呢個檔案）")){ skipped++; continue; }
      }
      seen.add(norm(f.name));
      toast("上傳中 " + (i+1) + "/" + list.length + "：" + f.name);
      if(f.size > 30*1024*1024) throw new Error("超過 30MB");
      const r = await fetch("/api/upload?name=" + encodeURIComponent(f.name) + "&cat=" + cat, {method:"POST", headers:{"x-admin-password":state.pw, "Content-Type":"application/pdf"}, body:f});
      const j = await r.json().catch(() => ({}));
      if(r.status === 401){ lock(); throw new Error("密碼錯誤，已退出管理"); }
      if(!r.ok) throw new Error(j.error || r.status);
      items = toItems(items.map(x => [x.cat, x.id, x.name, x.up]).concat([j.row]));
      ok++; updTotal(); render();
    } catch(err){ fail.push(f.name + "：" + err.message); }
  }
  toast((fail.length ? "已上傳 " + ok + " 份，" + fail.length + " 份失敗 — " + fail[0] : "已上傳 " + ok + " 份") + (skipped ? "，跳過 " + skipped + " 份重複" : ""));
};

// ---- 覆蓋檢查：表格股票清單 vs Drive 報告 ----
const cov = {sheet:null, err:"", loading:false, scope:"day", day:"", since:"2026-10-01", filter:"miss"};
function parseCsv(t){
  const rows = []; let row = [], f = "", q = false;
  for(let i = 0; i < t.length; i++){
    const c = t[i];
    if(q){ if(c === '"'){ if(t[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if(c === '"') q = true;
    else if(c === ","){ row.push(f); f = ""; }
    else if(c === "\n"){ row.push(f); rows.push(row); row = []; f = ""; }
    else if(c !== "\r") f += c;
  }
  if(f || row.length){ row.push(f); rows.push(row); }
  return rows;
}
async function loadSheet(force){
  if(cov.loading || (cov.sheet && !force)) return;
  cov.loading = true; cov.err = ""; renderCov();
  try {
    const r = await fetch("/api/sheet", {headers:{"x-admin-password":state.pw}}); const j = await r.json().catch(() => ({}));
    if(r.status === 401){ lock(); throw new Error("密碼錯誤，已退出管理"); }
    if(!r.ok) throw new Error(j.error || r.status);
    cov.sheet = parseCsv(j.csv).slice(1).map(c => ({theme:(c[0]||"").trim(), name:(c[1]||"").trim(), ticker:(c[2]||"").trim().toUpperCase(), added:(c[3]||"").trim(), owner:(c[4]||"").trim()}))
      .filter(x => x.ticker && x.ticker !== "大盤分析" && x.ticker !== "TICKER SYMBOL");
    cov.at = j.at;
  } catch(e){ cov.err = e.message; }
  cov.loading = false; renderCov();
}
const hkToday = () => new Date(Date.now() + 8*3600e3).toISOString().slice(0,10);
function covCompute(){
  const set = new Set(cov.sheet.map(x => x.ticker));
  const live = items.filter(r => !state.deleted.has(r.id) && r.date);
  const tickerOf = r => r.name.split(/[\s_\-()\[\]]+/).map(t => t.toUpperCase()).find(t => set.has(t)) || "";
  const typed = live.filter(r => r.cat === "stock" || r.cat === "card" || r.cat === "verify");
  const today = hkToday();
  const days = [...new Set(typed.map(r => r.date).filter(d => d <= today))].sort().reverse();
  if(!cov.day || !days.includes(cov.day)) cov.day = days[0] || "";
  const inScope = d => cov.scope === "day" ? d === cov.day : d >= cov.since;
  const has = {stock:new Set(), card:new Set(), verify:new Set()}, extras = new Set();
  typed.filter(r => inScope(r.date)).forEach(r => { const t = tickerOf(r); if(t) has[r.cat].add(t); else if(r.ticker) extras.add(r.ticker); });
  const req = cov.sheet.filter(x => cov.scope === "since" || !x.added || x.added <= cov.day);
  const rows = req.map(x => ({...x, s:has.stock.has(x.ticker), c:has.card.has(x.ticker), v:has.verify.has(x.ticker)}));
  rows.forEach(x => { x.n = (x.s?1:0) + (x.c?1:0) + (x.v?1:0); });
  const mk = live.filter(r => r.cat === "market").map(r => r.date).sort().pop() || "";
  return {rows, days, extras:[...extras].sort(), market:mk};
}
function renderCov(){
  const el = $("#cov"); if(state.cat !== "cov") return;
  if(cov.loading){ el.innerHTML = '<p class="note">讀取表格中…</p>'; return; }
  if(cov.err){ el.innerHTML = '<p class="note">⚠ ' + esc(cov.err) + '</p><button id="covRetry">重試</button>'; $("#covRetry").onclick = () => loadSheet(true); return; }
  if(!cov.sheet){ el.innerHTML = '<p class="note">未載入</p>'; return; }
  const d = covCompute(), all = d.rows;
  const ok = all.filter(x => x.n === 3), none = all.filter(x => x.n === 0), part = all.filter(x => x.n > 0 && x.n < 3);
  const scopeLabel = cov.scope === "day" ? cov.day : cov.since + " 起";
  const miss = (k, label) => { const l = all.filter(x => !x[k]).map(x => x.ticker); return l.length ? "欠" + label + "（" + l.length + "）：" + l.join("、") : ""; };
  const text = "【" + scopeLabel + " 報告覆蓋】\n" + [miss("s","個股研究"), miss("c","行動卡"), miss("v","核實報告")].filter(Boolean).join("\n");
  const shownRows = all.filter(x => cov.filter === "all" || (cov.filter === "miss" && x.n < 3) || (cov.filter === "none" && x.n === 0) || (cov.filter === "ok" && x.n === 3));
  const mark = v => v ? '<span class="ok">✓</span>' : '<span class="no">✗</span>';
  const fbtn = (k, l) => '<button data-f="' + k + '" class="' + (cov.filter === k ? "on" : "") + '">' + l + '</button>';
  el.innerHTML =
    '<div class="bar"><button data-s="day" class="' + (cov.scope==="day"?"on":"") + '">單日</button><button data-s="since" class="' + (cov.scope==="since"?"on":"") + '">自某日起</button>' +
    (cov.scope === "day" ? '<select id="covDay">' + d.days.map(x => '<option' + (x===cov.day?" selected":"") + '>' + x + '</option>').join("") + '</select>'
                         : '<input type="date" id="covSince" value="' + cov.since + '">') +
    '<button id="covReload">🔄 重新讀取表格</button></div>' +
    '<div class="sum"><b>' + scopeLabel + '</b>　清單 ' + all.length + ' 隻　✅ 三樣齊 <b>' + ok.length + '</b>　⚠ 欠部分 <b>' + part.length + '</b>　❌ 全冇 <b>' + none.length + '</b>' +
    (d.market ? '<div class="note">美股大盤分析最新：' + d.market + '</div>' : '') + '</div>' +
    '<div class="bar">' + fbtn("miss","欠任何一樣") + fbtn("none","全冇") + fbtn("ok","齊晒") + fbtn("all","全部") + '<button id="covCopy">複製欠嘅清單</button><button id="covWa">WhatsApp</button></div>' +
    '<table><tr><th>股票 / 負責人</th><th>個股</th><th>行動卡</th><th>核實</th></tr>' +
    (shownRows.map(x => '<tr><td><span class="tk">' + esc(x.ticker) + '</span> <span class="co">' + esc(x.name) + '</span><div class="co">' + esc(x.theme) + (x.owner ? " · " + esc(x.owner) : " · 未有人認領") + '</div></td><td>' + mark(x.s) + '</td><td>' + mark(x.c) + '</td><td>' + mark(x.v) + '</td></tr>').join("") || '<tr><td colspan="4">冇符合條件嘅股票 🎉</td></tr>') + '</table>' +
    (d.extras.length ? '<p class="note">不在表格清單但有報告：' + d.extras.map(esc).join("、") + '</p>' : '') +
    '<p class="note">按檔名入面嘅股票代號配對；單日模式只計表格「Added Date」當日或之前加入嘅股票。</p>';
  el.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { cov.scope = b.dataset.s; renderCov(); });
  el.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { cov.filter = b.dataset.f; renderCov(); });
  if($("#covDay")) $("#covDay").onchange = e => { cov.day = e.target.value; renderCov(); };
  if($("#covSince")) $("#covSince").onchange = e => { if(e.target.value){ cov.since = e.target.value; renderCov(); } };
  $("#covReload").onclick = () => loadSheet(true);
  $("#covCopy").onclick = async () => { try{ await navigator.clipboard.writeText(text); toast("已複製"); }catch(e){ toast("複製失敗"); } };
  $("#covWa").onclick = () => window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank", "noopener");
}
