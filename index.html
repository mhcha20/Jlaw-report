<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JLaw 報告中心</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1a1d23;--mute:#6b7280;--line:#e3e6eb;--brand:#0f766e;--wa:#25d366;--sel:#e6f4f1}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--ink:#e8eaee;--mute:#99a1ad;--line:#2a2f38;--brand:#2dd4bf;--sel:#12302c}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"PingFang HK","Noto Sans TC",sans-serif;padding-bottom:90px}
  header{padding:20px 16px 8px;max-width:900px;margin:0 auto}
  h1{margin:0;font-size:22px}
  header p{margin:4px 0 0;color:var(--mute);font-size:13px}
  header a{color:var(--brand)}
  #sync{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:3px 10px;font:inherit;cursor:pointer}
  #sync:disabled{opacity:.5}
  .wrap{max-width:900px;margin:0 auto;padding:0 16px}
  .tabs,.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
  .tabs button,.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer}
  .tabs button.on,.chips button.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .tools{display:flex;gap:8px;margin:4px 0 8px}
  .tools input[type=search]{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
  .tools button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:0 12px;font:inherit;cursor:pointer;white-space:nowrap}
  .group h2{font-size:13px;color:var(--mute);margin:16px 0 6px;font-weight:600}
  .item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px}
  .item.sel{background:var(--sel);border-color:var(--brand)}
  .item input{width:20px;height:20px;flex:none;accent-color:var(--brand)}
  .item .t{flex:1;min-width:0;cursor:pointer}
  .item .n{font-weight:600;word-break:break-all}
  .item .m{font-size:12px;color:var(--mute)}
  .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:var(--line);margin-right:4px}
  .up{margin-left:2px}
  .rt{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px}
  .szt{font-size:12px;color:var(--mute);white-space:nowrap}
  .open{flex:none;color:var(--brand);text-decoration:none;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:5px 10px}
  .empty{text-align:center;color:var(--mute);padding:40px 0}
  #bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:none}
  #bar.show{display:block}
  #bar .in{max-width:900px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  #bar .cnt{flex:1;min-width:90px;font-weight:600}
  #bar input{width:150px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  #bar button{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}
  #wa{background:var(--wa);color:#073b1a}
  #pdf{background:var(--brand);color:#fff}
  #pdf:disabled{opacity:.5}
  #cp,#clr{background:var(--line);color:var(--ink)}
  #adm{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:3px 10px;font:inherit;cursor:pointer}
  #adm.on{background:var(--brand);border-color:var(--brand);color:#fff}
  #up,#gconn{display:none;margin-left:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:3px 10px;font:inherit;cursor:pointer}
  #upcat{display:none;margin-left:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:3px 6px;font:inherit}
  #showHid{display:none;margin-left:6px;font-size:13px}
  #hide,#del{display:none}
  #hide{background:var(--line);color:var(--ink)}
  #del{background:#dc2626;color:#fff}
  .item.hid{opacity:.55}
  #sig .sum{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
  #sig .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  #sig .dt{font-size:17px;font-weight:700} #sig .mut{font-size:12px;color:var(--mute)}
  #sig .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  #sig .st{border:1px solid var(--line);border-radius:10px;padding:8px 2px;text-align:center;background:var(--bg);cursor:pointer}
  #sig .st b{display:block;font-size:22px;line-height:1.1} #sig .st span{display:block;font-size:11px;color:var(--mute);margin-top:2px}
  #sig .st.on{outline:2px solid var(--brand)}
  #sig .g b{color:#16a34a} #sig .y b{color:#d97706} #sig .w b{color:var(--mute)} #sig .r b{color:#dc2626}
  #sig .hl{font-size:13px;margin:6px 0;line-height:1.7} #sig .hl b{margin-right:4px}
  #sig .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
  #sig button.sm{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 9px;font:inherit}
  #sig .card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
  #sig .card.go{border-left-color:#16a34a} #sig .card.cond{border-left-color:#d97706} #sig .card.wait{border-left-color:var(--mute)} #sig .card.none{border-left-color:#dc2626}
  #sig .l1{display:flex;justify-content:space-between;align-items:center;gap:8px}
  #sig .tk{font-size:17px;font-weight:700} #sig .rt2{font-size:13px;color:var(--mute)}
  #sig .chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line);margin:2px 4px 2px 0;white-space:nowrap}
  #sig .chip.go{background:#16a34a;color:#fff;border-color:#16a34a} #sig .chip.cond{background:#fef3c7;color:#92400e;border-color:#fcd34d}
  #sig .chip.none{background:#fee2e2;color:#991b1b;border-color:#fca5a5} #sig .chip.wait{color:var(--mute)}
  #sig .ok{color:#16a34a} #sig .no{color:#dc2626}
  #sig .txt{font-size:13px;line-height:1.55;margin:4px 0} #sig .txt b{color:var(--mute);font-weight:600}
  #sig .lv{font-size:12.5px;color:var(--ink);margin:4px 0} #sig .lv span{white-space:nowrap;margin-right:10px}
  #sig .al{font-size:12px;color:var(--mute);margin:3px 0}
  #sig .feed{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
  #sig .feed h3{font-size:14px;margin:0 0 6px}
  #sig .rl{margin-top:3px;display:flex;flex-wrap:wrap;gap:6px} #sig .rl a{font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--brand);background:var(--card)}
  #sig .ev{font-size:13px;line-height:1.5;padding:5px 0;border-top:1px solid var(--line)} #sig .ev:first-of-type{border-top:0}
  #sig .tg{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:6px;margin-right:4px}
  #sig .tg.buy{background:#dcfce7;color:#166534} #sig .tg.sell{background:#fee2e2;color:#991b1b} #sig .tg.mixed{background:#fef3c7;color:#92400e}
  #sig .lastsig{font-size:12px;color:var(--mute);margin:3px 0}
  #sig .tl{margin:6px 0 2px;border-left:2px solid var(--line);padding-left:10px}
  #sig .tl .day{font-size:12.5px;line-height:1.55;margin:6px 0}
  #sig .tl .day .d{font-weight:700;margin-right:6px}
  #sig .tl .chg{color:var(--mute);margin-left:2px}
  #sig .tl .up{color:#16a34a} #sig .tl .down{color:#dc2626}
  #sig button.lnk{border:0;background:none;color:var(--brand);padding:2px 0;font:inherit;font-size:13px;cursor:pointer}
  #sig .vt{display:flex;gap:8px;margin:8px 0} #sig .vt button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px;font:inherit;font-weight:600;cursor:pointer}
  #sig .vt button.on{background:var(--brand);border-color:var(--brand);color:#fff}
  #sig .pos{color:#16a34a} #sig .neg{color:#dc2626}
  #sig .btr{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;cursor:pointer}
  #sig .btr .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  #sig .btr .big{font-size:16px;font-weight:700} #sig .btr .sub{font-size:12px;color:var(--mute);margin-top:3px;line-height:1.5}
  #sig .btr hr{border:0;border-top:1px dashed var(--line);margin:6px 0}
  #sig .btr .tr{font-size:12.5px;line-height:1.55;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
  #sig .ft{font-size:12px;color:var(--mute);margin:12px 0 4px;line-height:1.6}
  #sig .stale{color:#d97706;font-size:12px}
  #sig a.open{display:inline-block;margin-top:4px}
  #cov h3{font-size:15px;margin:14px 0 6px}
  #cov .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
  #cov select,#cov input[type=date],#cov button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 9px;font:inherit}
  #cov button.on{background:var(--brand);border-color:var(--brand);color:#fff}
  #cov .sum{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
  #cov .sum .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
  #cov .sum .dt{font-size:18px;font-weight:700}
  #cov .sum .mut{font-size:13px;color:var(--mute);white-space:nowrap}
  #cov .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  #cov .st{border:1px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center;background:var(--bg)}
  #cov .st b{display:block;font-size:26px;line-height:1.1}
  #cov .st span{display:block;font-size:12px;color:var(--mute);margin-top:2px}
  #cov .st.g b{color:#16a34a} #cov .st.a b{color:#d97706} #cov .st.r b{color:#dc2626}
  #cov .sum .mk{font-size:12px;color:var(--mute);margin-top:10px}
  #cov table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px}
  #cov th,#cov td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center}
  #cov th:first-child,#cov td:first-child{text-align:left}
  #cov .tk{font-weight:700} #cov .co{font-size:11px;color:var(--mute)} #cov .ok{color:#16a34a} #cov .no{color:#dc2626;font-weight:700}
  #cov .note{font-size:12px;color:var(--mute);margin:6px 0}
  #peer .note{font-size:12px;color:var(--mute);margin:6px 0;line-height:1.6}
  #peer .warnbox{background:var(--card);border:1px solid #d97706;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.6;margin:8px 0}
  #peer .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
  #peer .bar input{flex:1;min-width:120px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
  #peer button.sm{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
  #peer button.sm.on{background:var(--brand);border-color:var(--brand);color:#fff}
  #peer button.lnk{border:0;background:none;color:var(--brand);padding:2px 0;font:inherit;font-size:13px;cursor:pointer}
  #peer .pc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
  #peer .pc .tk{font-size:17px;font-weight:700}
  #peer .our{font-size:13px;margin:4px 0 6px;color:var(--mute)} #peer .our b{color:var(--ink)}
  #peer .pr{border-top:1px solid var(--line);padding:7px 0;font-size:13px;line-height:1.6}
  #peer .own{font-weight:700} #peer .mut{color:var(--mute);font-size:12px}
  #peer .bd{display:inline-block;font-size:12px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);margin:2px 4px 2px 0;white-space:nowrap}
  #peer .bd.ok{background:#dcfce7;color:#166534;border-color:#86efac} #peer .bd.warn{background:#fee2e2;color:#991b1b;border-color:#fca5a5}
  #peer .bd.diff{background:#fef3c7;color:#92400e;border-color:#fcd34d} #peer .bd.unk,#peer .bd.na{color:var(--mute)}
  #peer a.pdf{color:var(--brand);text-decoration:none;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:2px 8px;margin-right:6px;display:inline-block}
  #peer .act{font-size:12.5px;margin:4px 0;padding:6px 8px;background:var(--bg);border-radius:8px}
  #peer table.pt{width:100%;border-collapse:collapse;font-size:12.5px;margin:4px 0}
  #peer table.pt td,#peer table.pt th{padding:3px 4px;border-bottom:1px solid var(--line);text-align:left}
  #peer .ppl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);font-size:13.5px}
  #peer .ppl th,#peer .ppl td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center} #peer .ppl th:first-child,#peer .ppl td:first-child{text-align:left}
  #toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;display:none}
</style>
</head>
<body>
<header>
  <h1>JLaw 報告中心</h1>
  <p>共 <span id="total"></span> 份報告 · <a id="stk" href="#" style="color:inherit;text-decoration:underline dotted"></a> · 撳標題打開 PDF · 剔選後可直接 WhatsApp 分享 ·
    <a id="f1" target="_blank" rel="noopener">Drive 資料夾 1</a> / <a id="f2" target="_blank" rel="noopener">2</a>
    · <button id="sync" type="button">🔄 同步 Drive</button> <span id="syncAt"></span>
    · <button id="adm" type="button">🔒 管理</button><label id="showHid"><input type="checkbox" id="showHidCb"> 顯示已隱藏</label>
    <button id="gconn" type="button">🔗 連接 Google</button>
    <select id="upcat" aria-label="上傳類型"><option value="auto">自動判斷類型</option><option value="market">美股大盤</option><option value="daily">每日跨股總表</option><option value="stock">個股研究報告</option><option value="card">行動卡</option><option value="verify">核實報告</option></select>
    <button id="up" type="button">⬆ 上傳報告</button><input type="file" id="upfile" accept="application/pdf,.pdf" multiple hidden></p>
</header>
<div class="wrap">
  <div id="stkList" style="display:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px;line-height:1.7"></div>
  <div class="tabs" id="tabs"></div>
  <div class="tabs" id="mkts"></div>
  <div class="chips" id="chips"></div>
  <div class="tools">
    <input type="search" id="q" placeholder="搜尋（股票代號、日期、報告類型…）">
    <button id="selAll">全選當前</button>
  </div>
  <div id="list"></div>
  <div id="cov" style="display:none"></div>
  <div id="sig" style="display:none"></div>
  <div id="peer" style="display:none"></div>
</div>

<div id="bar"><div class="in">
  <span class="cnt" id="cnt"></span>
  <input id="phone" type="tel" inputmode="tel" placeholder="電話（選填，如 85291234567）">
  <button id="clr">清除</button>
  <button id="hide">隱藏</button>
  <button id="del">🗑 Drive 刪除</button>
  <button id="cp">複製訊息</button>
  <button id="pdf" style="display:none">分享 PDF 檔案</button>
  <button id="wa">WhatsApp 連結</button>
</div></div>
<div id="toast"></div>

<script src="data.js"></script>
<script>
const CATS = {market:"美股大盤", daily:"每日跨股總表", stock:"個股研究", card:"行動卡", verify:"核實報告", other:"其他"};
const link = id => "https://drive.google.com/file/d/" + id + "/view";
const hkFmt = new Intl.DateTimeFormat("zh-HK", {timeZone:"Asia/Hong_Kong", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hour12:false});
const hkTime = iso => { const o = Object.fromEntries(hkFmt.formatToParts(new Date(iso)).map(x => [x.type, x.value])); return o.month + "-" + o.day + " " + (o.hour==="24"?"00":o.hour) + ":" + o.minute; };
const fmtSize = n => !n ? "" : n < 1048576 ? Math.max(1, Math.round(n/1024)) + " KB" : (n/1048576).toFixed(1) + " MB";
const toItems = rows => rows.map(([cat,id,name,up,size]) => {
  const dm = name.match(/\d{4}-\d{2}-\d{2}/) || name.match(/(?<!\d)20\d{6}(?!\d)/);
  const date = dm ? (dm[0].includes("-") ? dm[0] : dm[0].replace(/^(\d{4})(\d{2})(\d{2})$/, "$1-$2-$3")) : "";
  const rest = name.replace(dm ? dm[0] : "", "").replace(/\s+_+/, " ").replace(/([-_\s])[-_\s]+/g, "$1").replace(/^[\s_-]+|[\s_-]+$/g, "");   // 例：「[舊版備份] DE_行動卡」
  const tk = (dm ? name.replace(dm[0], " ") : name).split(/[_\s-]+/).find(t => /^(?:[A-Z]{1,5}|\d{4,6})$/.test(t)) || "";   // 美股字母代號，或港／日／韓等數字代號（如 00066）
  return {cat, id, name, up, size:size||0, date, title:rest || name, ticker:tk, url:link(id)};
}).sort((a,b) => b.date.localeCompare(a.date) || a.name.localeCompare(b.name));
let items = toItems(window.REPORTS);

const $ = s => document.querySelector(s);
const MKTS = [["all","🌐 全部"], ["us","🇺🇸 美股"], ["hk","🇭🇰 港股"], ["jp","🇯🇵 日股"], ["kr","🇰🇷 韓股"], ["eu","🇪🇺 歐洲"], ["ca","🇨🇦 加拿大"]];
const MKT_OVERRIDE = {NESN:"eu", SCHN:"eu", ATD:"ca", MC:"eu"};   // 英文字母代號但唔係美股（要同 prices.js 嘅 OVERRIDE 一致）
// 市場判斷：檔名代號 5 位數字或 0 開頭 4 位＝港股、6 位＝韓股、其他 4 位＝日股、字母＝美股；冇代號嘅報告按名稱關鍵字，否則歸美股
const mktOf = (t, name) => t ? (MKT_OVERRIDE[t] ? MKT_OVERRIDE[t] : /^(\d{5}|0\d{3})$/.test(t) ? "hk" : /^\d{6}$/.test(t) ? "kr" : /^\d{4}$/.test(t) ? "jp" : "us")
  : /港股|恒生|恆生/.test(name || "") ? "hk" : /日本|日股|日經/.test(name || "") ? "jp" : /韓國|韓股|KOSPI/i.test(name || "") ? "kr" : "us";
const mktOk = m => state.mkt === "all" || state.mkt === m;
const state = {cat:"all", mkt:"all", ticker:"all", q:"", sel:new Set(), hidden:new Set(), deleted:new Set(), showHidden:false, pw:"", canDelete:false, canUpload:false, googleReady:false, googleConnected:false};
try { const s = JSON.parse(localStorage.getItem("jlaw-sel")||"[]"); s.forEach(i => state.sel.add(i)); $("#phone").value = localStorage.getItem("jlaw-phone")||""; } catch(e){}

const shown = () => items.filter(r => !state.deleted.has(r.id) && !state.hidden.has(r.id));
const updTotal = () => {
  $("#total").textContent = shown().length;
  const by = {}; new Set(shown().map(r => r.ticker).filter(Boolean)).forEach(t => { const m = mktOf(t); by[m] = (by[m] || 0) + 1; });
  const n = Object.values(by).reduce((a, b) => a + b, 0);
  $("#stk").textContent = n + " 隻股票（" + MKTS.slice(1).filter(([k]) => by[k]).map(([k, l]) => l.split(" ")[0] + by[k]).join(" ") + "）";   // 有報告嘅股票數，按市場
};
function stkPanel(){   // 撳標題股票數：列出每個市場所有股票代號同報告份數；已載入 Sheet 清單嘅話，唔喺清單嘅標 🔸
  const cnt = {}; shown().forEach(r => { if(r.ticker) cnt[r.ticker] = (cnt[r.ticker] || 0) + 1; });

// ---- 直接分享 PDF 檔案（手機瀏覽器 Web Share API）----
// 揀選時預先下載，確保撳掣時可即時 share（iOS 要求喺撳掣當下呼叫）
const files = new Map();
function canShareFiles(){
  try { return !!navigator.canShare && navigator.canShare({files:[new File(["x"],"x.pdf",{type:"application/pdf"})]}); } catch(e){ return false; }
}
const fileShare = canShareFiles();
function prefetch(){
  if(!fileShare) return;
  selected().forEach(r => {
    if(files.has(r.id)) return;
    files.set(r.id, fetch("/pdf/" + r.id).then(x => { if(!x.ok) throw 0; return x.blob(); })
      .then(b => new File([b], r.name + ".pdf", {type:"application/pdf"}))
      .catch(() => { files.delete(r.id); return null; }));
  });
}
const readyFiles = () => selected().map(r => files.get(r.id)).filter(Boolean);
async function refreshPdfBtn(){
  const b = $("#pdf"); if(!fileShare){ b.style.display="none"; return; }
  b.style.display = ""; prefetch();
  const n = state.sel.size, done = await Promise.all(selected().map(r => files.get(r.id)));
  const loaded = done.filter(Boolean).length;
  b.disabled = loaded < n; b.textContent = loaded < n ? "準備 PDF… " + loaded + "/" + n : "分享 PDF 檔案";
  if(loaded < n && state.sel.size === n) setTimeout(refreshPdfBtn, 500);

};

async function syncDrive(manual){
  const b = $("#sync"); b.disabled = true; b.textContent = "同步中…";
  try {
    const r = await fetch("/api/sync"); const j = await r.json();
    if(!r.ok) throw new Error(r.status === 503 ? "未設定 DRIVE_API_KEY" : (j.error || r.status));
    const before = new Set(items.map(x => x.id));
    items = toItems(j.rows);
    const added = items.filter(x => !before.has(x.id) && !state.deleted.has(x.id)).length, removed = [...before].filter(id => !items.some(x => x.id === id)).length;
    [...state.sel].forEach(id => { if(!items.some(x => x.id === id)) state.sel.delete(id); });
    updTotal(); persist(); render();
    $("#syncAt").textContent = "最後同步 " + hkTime(new Date().toISOString()).slice(6) + " HKT";
    if(manual) toast(added || removed ? "新增 " + added + " 份" + (removed ? "，移除 " + removed + " 份" : "") : "已係最新");
  } catch(e){ if(manual) toast("同步失敗：" + e.message); }
  finally { b.disabled = false; b.textContent = "🔄 同步 Drive"; }
}

$("#upfile").onchange = async e => {
  const list = [...e.target.files]; e.target.value = "";
  if(!list.length) return;
  const cat = $("#upcat").value; let ok = 0, fail = [], skipped = 0;
  await syncDrive(false);   // 先同步一次，確保重複檢查用嘅係最新清單
  const norm = s => s.replace(/\.pdf$/i, "").trim().toLowerCase();
  const seen = new Set();   // 今次一齊揀嘅檔案之間都檢查重複
  for(let i = 0; i < list.length; i++){
    const f = list[i];
    try {
      if(!/\.pdf$/i.test(f.name)) throw new Error("唔係 PDF");
      const same = items.find(x => !state.deleted.has(x.id) && norm(x.name) === norm(f.name));
      if(same || seen.has(norm(f.name))){
        const when = same ? "（已於 " + hkTime(same.up) + " HKT 上傳" + (state.hidden.has(same.id) ? "，目前已隱藏" : "") + "）" : "（今次一齊揀咗兩份同名檔案）";
        if(!confirm("⚠ 重複上傳\n\n「" + f.name + "」已經存在" + when + "。\n\n繼續上傳嘅話 Drive 會有兩份同名檔案（網頁只會顯示較新嗰份）。\n\n要繼續上傳嗎？\n（取消 = 跳過呢個檔案）")){ skipped++; continue; }
      }
      seen.add(norm(f.name));
      toast("上傳中 " + (i+1) + "/" + list.length + "：" + f.name);
      if(f.size > 30*1024*1024) throw new Error("超過 30MB");
      const r = await fetch("/api/upload?name=" + encodeURIComponent(f.name) + "&cat=" + cat, {method:"POST", headers:{"x-admin-password":state.pw, "Content-Type":"application/pdf"}, body:f});
      const j = await r.json().catch(() => ({}));
      if(r.status === 401){ lock(); throw new Error("密碼錯誤，已退出管理"); }
      if(!r.ok) throw new Error(j.error || r.status);
      items = toItems(items.map(x => [x.cat, x.id, x.name, x.up, x.size]).concat([j.row]));
      ok++; updTotal(); render();
    } catch(err){ fail.push(f.name + "：" + err.message); }
  }
  toast((fail.length ? "已上傳 " + ok + " 份，" + fail.length + " 份失敗 — " + fail[0] : "已上傳 " + ok + " 份") + (skipped ? "，跳過 " + skipped + " 份重複" : ""));
};

// ---- 覆蓋檢查：表格股票清單 vs Drive 報告 ----
const cov = {sheet:null, err:"", loading:false, scope:"day", day:"", since:"2026-10-01", filter:"miss"};
function parseCsv(t){
  const rows = []; let row = [], f = "", q = false;
  for(let i = 0; i < t.length; i++){
    const c = t[i];
    if(q){ if(c === '"'){ if(t[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if(c === '"') q = true;
    else if(c === ","){ row.push(f); f = ""; }
    else if(c === "\n"){ row.push(f); rows.push(row); row = []; f = ""; }
    else if(c !== "\r") f += c;
  }
  if(f || row.length){ row.push(f); rows.push(row); }
  return rows;
}
async function loadSheet(force){
  if(cov.loading || (cov.sheet && !force)) return;
  cov.loading = true; cov.err = ""; renderCov();
  try {
    const r = await fetch("/api/sheet", {headers:{"x-admin-password":state.pw}}); const j = await r.json().catch(() => ({}));
    if(r.status === 401){ lock(); throw new Error("密碼錯誤，已退出管理"); }
    if(!r.ok) throw new Error(j.error || r.status);
    cov.sheet = parseCsv(j.csv).slice(1).map(c => ({theme:(c[0]||"").trim(), name:(c[1]||"").trim(), ticker:(c[2]||"").trim().toUpperCase(), added:(c[3]||"").trim(), owner:(c[4]||"").trim()}))
      .filter(x => x.ticker && x.ticker !== "大盤分析" && x.ticker !== "TICKER SYMBOL");
    cov.at = j.at;
  } catch(e){ cov.err = e.message; }
  cov.loading = false; renderCov();
}
const hkToday = () => new Date(Date.now() + 8*3600e3).toISOString().slice(0,10);
const tkKey = t => { t = String(t).toUpperCase().replace(/\.(HK|T|KS|KQ|SS|SZ)$/, ""); return /^\d+$/.test(t) ? String(+t) : t; };   // 港／日／韓股：00066、0066、66、0066.HK 視為同一隻
// 週六日嘅檔名日期（例如 10-17 批其實係 10-16 收市）當成上一個星期五，覆蓋檢查先會同 10-16 批併埋計
const tdate = d => { const t = new Date(d + "T00:00:00Z"); if(isNaN(t)) return d; const w = t.getUTCDay(); if(w === 6) t.setUTCDate(t.getUTCDate() - 1); else if(w === 0) t.setUTCDate(t.getUTCDate() - 2); return t.toISOString().slice(0,10); };
function covCompute(){
  const set = new Set(cov.sheet.map(x => tkKey(x.ticker)));
  const live = items.filter(r => !state.deleted.has(r.id) && r.date);
  const tickerOf = r => r.name.replace(/\d{4}-\d{2}-\d{2}|(?<!\d)20\d{6}(?!\d)/, " ").split(/[\s_\-()\[\]]+/).map(tkKey).find(t => set.has(t)) || "";
  const typed = live.filter(r => r.cat === "stock" || r.cat === "card" || r.cat === "verify");
  const today = hkToday();
  const days = [...new Set(typed.map(r => tdate(r.date)).filter(d => d <= today))].sort().reverse();
  if(!cov.day || !days.includes(cov.day)) cov.day = days[0] || "";
  const inScope = d => cov.scope === "day" ? d === cov.day : d >= cov.since;
  const has = {stock:new Set(), card:new Set(), verify:new Set()}, extras = new Set();
  typed.filter(r => inScope(tdate(r.date))).forEach(r => { const t = tickerOf(r); if(t) has[r.cat].add(t); else if(r.ticker && mktOk(mktOf(r.ticker, r.name))) extras.add(r.ticker); });
  const sheetMkt = x => /港股/.test(x.theme) ? "hk" : /日股/.test(x.theme) ? "jp" : /韓股/.test(x.theme) ? "kr" : /歐洲/.test(x.theme) ? "eu" : /加拿大/.test(x.theme) ? "ca" : "us";   // 表格主題欄標明市場；其餘當美股
  const req = cov.sheet.filter(x => mktOk(sheetMkt(x)) && (cov.scope === "since" || !x.added || tdate(x.added) <= cov.day));
  const rows = req.map(x => ({...x, s:has.stock.has(tkKey(x.ticker)), c:has.card.has(tkKey(x.ticker)), v:has.verify.has(tkKey(x.ticker))}));
  rows.forEach(x => { x.n = (x.s?1:0) + (x.c?1:0) + (x.v?1:0); });
  const mk = live.filter(r => r.cat === "market").map(r => r.date).sort().pop() || "";
  return {rows, days, extras:[...extras].sort(), market:mk};
}
function renderCov(){
  const el = $("#cov"); if(state.cat !== "cov") return;
  if(cov.loading){ el.innerHTML = '<p class="note">讀取表格中…</p>'; return; }
  if(cov.err){ el.innerHTML = '<p class="note">⚠ ' + esc(cov.err) + '</p><button id="covRetry">重試</button>'; $("#covRetry").onclick = () => loadSheet(true); return; }
  if(!cov.sheet){ el.innerHTML = '<p class="note">未載入</p>'; return; }
  const d = covCompute(), all = d.rows;
  const ok = all.filter(x => x.n === 3), none = all.filter(x => x.n === 0), part = all.filter(x => x.n > 0 && x.n < 3);
  const scopeLabel = cov.scope === "day" ? cov.day : cov.since + " 起";

const sg = {view:"list", btSort:"ret", btOpen:new Set(), data:null, err:"", loading:false, filter:"all", timer:null, open:new Set(), feedAll:false};
async function loadSig(force){
  if(sg.loading) return; sg.loading = true; sg.err = ""; if(!sg.data) renderSig();
  try {
    const r = await fetch("/api/signals" + (force ? "?refresh=1" : ""), {headers:{"x-admin-password":state.pw}}); const j = await r.json().catch(() => ({}));
    if(r.status === 401){ lock(); throw new Error("密碼錯誤，已退出管理"); }
    if(!r.ok) throw new Error(j.error || r.status);
    sg.data = j;
  } catch(e){ sg.err = e.message; }
  sg.loading = false; renderSig();
  clearTimeout(sg.timer);
  if(state.cat === "sig" && sg.data && (sg.data.pending > 0 || sg.data.running)) sg.timer = setTimeout(() => loadSig(false), 3000);
}

  const cap = latest.map(r => r.cap).find(Boolean);
  const scores = rows.filter(r => typeof r.score === "number");
  const avg = scores.length ? (scores.reduce((s, r) => s + r.score, 0) / scores.length).toFixed(0) : "–";
  const nearBuy = rows.filter(r => r.levels && r.levels.buy && r.levels.buy.dir === "up" && r.levels.buy.pct <= 3).sort((a,b) => a.levels.buy.pct - b.levels.buy.pct).slice(0, 6);
  const nearStop = rows.filter(r => r.levels && r.levels.stop && r.levels.stop.pct <= 3).sort((a,b) => a.levels.stop.pct - b.levels.stop.pct).slice(0, 6);
  const movers = rows.filter(r => typeof r.score === "number" && typeof r.prevScore === "number" && r.score !== r.prevScore).sort((a,b) => Math.abs(b.score-b.prevScore) - Math.abs(a.score-a.prevScore)).slice(0, 5);

  const gate = (v, label) => v === null || v === undefined ? "" : '<span class="' + (v ? "ok" : "no") + '">' + (v ? "✔" : "✘") + label + '</span> ';
  const dlt = r => typeof r.prevScore === "number" ? (r.score > r.prevScore ? ' <span class="ok">▲' + (r.score - r.prevScore) + '</span>' : r.score < r.prevScore ? ' <span class="no">▼' + (r.prevScore - r.score) + '</span>' : ' <span class="mut">持平</span>') : "";
  const stat = (k, cls, lab) => '<div class="st ' + cls + (sg.filter === k ? " on" : "") + '" data-f="' + k + '"><b>' + cnt(k) + '</b><span>' + lab + '</span></div>';

    '<div class="stats">' + stat("go","g","🟢 三閘全過") + stat("cond","y","🟡 條件式") + stat("wait","w","⚪ 觀望") + stat("none","r","🔴 零新倉") + '</div>' +

    (nearBuy.length ? '<div class="hl"><b>🎯 接近買入觸發（≤3%）：</b>' + nearBuy.map(r => esc(r.ticker) + ' ▲' + p2(r.levels.buy.pct) + '%').join('、') + '</div>' : '') +
    (nearStop.length ? '<div class="hl"><b>🛑 接近止損（≤3%）：</b>' + nearStop.map(r => esc(r.ticker) + ' ▼' + p2(r.levels.stop.pct) + '%').join('、') + '</div>' : '') +
    (movers.length ? '<div class="hl"><b>📈 分數變動：</b>' + movers.map(r => esc(r.ticker) + ' ' + r.prevScore + '→' + r.score).join('、') + '</div>' : '') + '</div>' +
    feedHtml(d) +
    '<div class="bar"><button class="sm" id="sgAll">' + (sg.filter === "all" ? "✓ " : "") + '全部（' + rows.length + '）</button>' + (state.pw ? '<button class="sm" id="sgReload">🔄 重新分析</button>' : '') + '</div>' +
    (shown.map(r => {
      const c = r.cls, lv = r.levels || {}, stale = r.date < maxDate;
      const al = (r.alerts || []).filter(a => typeof a.pct === "number").sort((a,b) => a.pct - b.pct).slice(0, 2);
      return '<div class="card ' + c.flat.key + '"><div class="l1"><span class="tk">' + esc(r.ticker) + '</span><span class="rt2">' + (r.stars ? "★".repeat(r.stars) + " " : "") + esc(r.rating || "") + (typeof r.score === "number" ? ' · ' + r.score + dlt(r) : "") + '</span></div>' +

const TAGS = {buy:["buy","🟢 買入訊號"], sell:["sell","🔴 賣出訊號"], mixed:["mixed","🟡 買賣訊號並存"]};
// 某股票某日（按交易日，週末檔名當星期五）嘅行動卡／個股報告／核對附錄連結，同類只取最新上傳
function repLinks(t, d){

const pc = x => (x >= 0 ? "+" : "") + (x * 100).toFixed(2) + "%";
const WD = ["日","一","二","三","四","五","六"];
const wd = d => d.slice(5) + "（" + WD[new Date(d + "T00:00:00Z").getUTCDay()] + "）";
function btHtml(d){
  const bt = d.bt || {}, all = Object.entries(bt).map(([t, r]) => ({t, ...r}));

  const win = all.filter(r => r.ret > 0.00005).length, lose = all.filter(r => r.ret < -0.00005).length, none = all.filter(r => !r.traded).length;
  const closed = all.flatMap(r => r.trades), cw = closed.filter(t => t.ret > 0).length;
  const pend = all.reduce((s, r) => s + (r.pending || []).length, 0);
  const bhs = all.filter(r => r.bh !== null && r.bh !== undefined), bhAvg = bhs.length ? bhs.reduce((s, r) => s + r.bh, 0) / bhs.length : null;
  const from = all.map(r => r.from).filter(Boolean).sort()[0] || "", to = all.map(r => r.to).filter(Boolean).sort().pop() || "";
  const px = d.px || {have:0, failed:0};
  // 最近一次買入訊號日期：已成交買入嘅成交日、持倉中嘅買入日、待成交買單嘅出訊號日（取最新）
  const lastBuy = r => [...(r.trades || []).map(t => t.buy.fillDate), r.open && r.open.fillDate, ...(r.pending || []).filter(p => p.side === "buy").map(p => p.signalDate)].filter(Boolean).sort().pop() || "";
  const sorted = all.slice().sort((a, b) => sg.btSort === "new" ? lastBuy(b).localeCompare(lastBuy(a)) || a.t.localeCompare(b.t) : sg.btSort === "ret" ? b.ret - a.ret : sg.btSort === "low" ? a.ret - b.ret : a.t.localeCompare(b.t));
  const sb = (k, l) => '<button class="sm' + (sg.btSort === k ? " on" : "") + '" data-bs="' + k + '">' + l + '</button>';
  const why = (label, f, t) => '<div class="sub"><b>' + label + '：</b>' + esc(f.why || "") + (f.detail || []).map(x => '<br>・' + esc(x)).join("") + repLinks(t, f.signalDate) + '</div>';   // 買賣原因：一句總結＋當日卡內明細
  const buyTxt = b => wd(b.signalDate) + ' 出訊號 → <b>' + wd(b.fillDate) + ' 開市價 ' + p2(b.price) + ' 買入</b>';
  const sellTxt = s => wd(s.signalDate) + ' 出訊號 → <b>' + wd(s.fillDate) + ' 開市價 ' + p2(s.price) + ' 賣出</b>';
  return '<div class="sum"><div class="hd"><span class="dt">每隻 $100 模擬</span><span class="mut">' + from.slice(5) + ' → ' + to.slice(5) + ' · ' + N + ' 隻</span></div>' +
    '<div class="stats"><div class="st ' + (fin >= inv ? "g" : "r") + '"><b>' + pc(fin / inv - 1) + '</b><span>總報酬</span></div><div class="st g"><b>' + win + '</b><span>賺錢</span></div><div class="st r"><b>' + lose + '</b><span>蝕錢</span></div><div class="st w"><b>' + none + '</b><span>未入場</span></div></div>' +
    '<div class="hl"><b>總投入：</b>$' + inv.toFixed(0) + ' → <b>$' + fin.toFixed(2) + '</b>　<b>已平倉交易：</b>' + closed.length + ' 次（勝 ' + cw + ' 負 ' + (closed.length - cw) + '）' +
    (pend ? '　<b>⏳ 待成交：</b>' + pend + ' 單' : '') + (bhAvg !== null ? '　<b>同期一直持有（平均）：</b>' + pc(bhAvg) : '') + '</div>' +
    '<div class="hl mut">成交規則：訊號喺行動卡日期收市後先出 → <b>下一個交易日開市價</b>成交。行情：' + (px.have ? px.have + ' 隻已有' + (px.src ? '（' + esc(px.src) + '）' : '') : '暫時未有') + (px.failed ? '，<span class="neg">' + px.failed + ' 隻攞唔到</span>' : '') + '</div></div>' +
    (px.failed && !px.have ? '<div class="feed"><b>⚠ 未攞到行情</b><div class="note">伺服器暫時讀唔到每日開市價，所以未能計算成交（所有股票顯示 $100）。' + (px.lastErr ? '原因：' + esc(px.lastErr) : '') + '</div></div>' : '') +
    '<div class="bar">' + sb("ret", "報酬高→低") + sb("low", "報酬低→高") + sb("az", "A–Z") + sb("new", "最新買入") + '</div>' +
    sorted.map(r => {
      const open = sg.btOpen.has(r.t);
      const status = !r.hasPrices ? '⚠ 未攞到行情，計唔到成交' + (r.pxErr ? '（' + esc(r.pxErr) + '）' : '') : r.open ? '持倉中（最新收市 ' + p2(r.open.now) + '，' + r.open.nowDate.slice(5) + '）' : r.traded ? '已平倉' : (r.pending || []).length ? '⏳ 訊號待成交' : '未入場（未有買入訊號）';
      const trs = r.trades.map(t => '<div>' + buyTxt(t.buy) + '<br>' + sellTxt(t.sell) + '　<b class="' + (t.ret >= 0 ? "pos" : "neg") + '">' + pc(t.ret) + '</b>' + why("買因", t.buy, r.t) + why("賣因", t.sell, r.t) + '</div>').join("<hr>") +
        (r.open ? (r.trades.length ? "<hr>" : "") + '<div>' + buyTxt(r.open) + '<br>持倉中，最新收市（' + r.open.nowDate.slice(5) + '）' + p2(r.open.now) + '　<b class="' + (r.open.ret >= 0 ? "pos" : "neg") + '">' + pc(r.open.ret) + '</b>' + why("買因", r.open, r.t) + '</div>' : '') +
        (r.pending || []).map(p => '<div class="sub">⏳ ' + wd(p.signalDate) + ' 出' + (p.side === "buy" ? "買入" : "賣出") + '訊號（' + esc(p.why) + '），等待下一個交易日開市價成交' + (p.detail || []).map(x => '<br>・' + esc(x)).join("") + repLinks(r.t, p.signalDate) + '</div>').join("");
      return '<div class="btr" data-bt="' + esc(r.t) + '"><div class="top"><span class="big">' + esc(r.t) + '</span><span class="big ' + (r.ret >= 0.00005 ? "pos" : r.ret <= -0.00005 ? "neg" : "") + '">$' + r.final.toFixed(2) + '（' + pc(r.ret) + '）</span></div>' +
        '<div class="sub">' + r.trades.length + ' 次平倉（勝 ' + r.wins + ' 負 ' + r.losses + '）· ' + status + (sg.btSort === "new" && lastBuy(r) ? ' · 最近買入 ' + lastBuy(r).slice(5) : '') + (r.bh !== null && r.bh !== undefined ? ' · 一直持有 ' + pc(r.bh) : '') + '</div>' +
        (open ? '<div class="tr">' + (trs || '<span class="mut">未有交易</span>') + '</div>' : (trs ? '<div class="sub">點擊睇每次買賣日期同價位 ▾</div>' : '')) + '</div>';
    }).join("") +
    '<div class="ft"><b>模擬假設：</b>每隻股票起始 $100；<b>買入訊號出咗之後，下一個交易日開市價買入；賣出訊號出咗之後，下一個交易日開市價全數賣出</b>，所得複利滾存。起始日已係買入狀態亦當作買入訊號。同日買賣訊號並存時，持倉當賣出、未持倉唔買；持倉時再出現買入訊號唔加倉。持倉中按最新收市價計。可買碎股，唔計手續費、滑點同稅。<br><b>留意：</b>開市價嚟自免費日線行情，可能同你券商實際成交價有差異（開市即時價波動大）；只有約 ' + Math.max(...all.map(r => r.days)) + ' 日數據，樣本好少，過去表現唔代表將來；呢個唔係投資建議。</div>';
}

// ---- 群友對照（需管理密碼；唔入買賣訊號）----
const pr = {data:null, err:"", loading:false, view:"stock", q:"", open:new Set(), older:new Set(), timer:null, ours:null};
async function loadPeers(force){
  if(pr.loading || !state.pw) return; pr.loading = true; pr.err = ""; if(!pr.data) renderPeer();
  try {
    if(force){ const r0 = await api("/api/peers/refresh"); if(!r0.ok) throw new Error(r0.j.error || r0.status); }
    const r = await fetch("/api/peers", {headers:{"x-admin-password":state.pw}}); const j = await r.json().catch(() => ({}));
    if(r.status === 401){ lock(); throw new Error("密碼錯誤，已退出管理"); }
    if(!r.ok) throw new Error(j.error || r.status);
    pr.data = j;
    if(!pr.ours) fetch("/api/signals").then(x => x.json()).then(j2 => { pr.ours = j2.historyAll || j2.history || {}; renderPeer(); }).catch(() => { pr.ours = {}; });
  } catch(e){ pr.err = e.message; }
  pr.loading = false; renderPeer();
  clearTimeout(pr.timer);
  if(state.cat === "peer" && pr.data && pr.data.state && pr.data.state.running) pr.timer = setTimeout(() => loadPeers(false), 3000);
}
const BD = {ok:"✓", warn:"⚠", diff:"來源差異", unk:"？", na:"–"};
const peerBadges = f => {
  if(f.image) return '<span class="bd unk">圖像檔，未能自動讀取</span>';
  if(f.err) return '<span class="bd unk">讀取失敗：' + esc(f.err) + '</span>';
  const v = f.v; if(!v) return '<span class="bd unk">未核對</span>';
  const one = (lab, o) => o.st === "na" ? "" : '<span class="bd ' + o.st + '">' + lab + " " + BD[o.st] + '</span>';
  return one("收市價", v.close) + (v.lag ? '<span class="bd warn">落後一日</span>' : "") + one("均線", v.sma) + one("成交量", v.vol) + (v.verdict === "unk" && v.close.st === "na" && v.sma.st === "na" && v.vol.st === "na" ? '<span class="bd unk">抽唔到可核對數字</span>' : "");
};
const fnum = x => typeof x === "number" ? (Math.abs(x) >= 1e5 ? x.toLocaleString("en-US", {maximumFractionDigits:0}) : String(x)) : "";
function peerDetail(f){
  const v = f.v, p = f.parsed || {}; let h = "";
  if(p.action) h += '<div class="act"><b>今日動作：</b>' + esc(p.action) + '</div>';
  if(v){
    const rows = [];
    if(v.close.claim !== undefined) rows.push(["收市價", v.close.claim, v.close.actual, v.close.st, v.close.note]);
    (v.sma.items || []).forEach(x => rows.push(["SMA" + x.n, x.claim, x.actual, x.st, x.note]));
    if(v.vol.claim !== undefined) rows.push(["成交量", v.vol.claim, v.vol.actual, v.vol.st, v.vol.note]);
    if(rows.length) h += '<table class="pt"><tr><th>項目</th><th>卡內</th><th>行情</th><th></th></tr>' + rows.map(r => '<tr><td>' + r[0] + '</td><td>' + fnum(r[1]) + '</td><td>' + fnum(r[2]) + '</td><td>' + BD[r[3]] + (r[4] ? " " + esc(r[4]) : "") + '</td></tr>').join("") + '</table>';
    if(v.note) h += '<div class="mut">' + esc(v.note) + '</div>';
  }
  if(f.textDate && f.textDate !== f.date) h += '<div class="mut">檔名日期 ' + esc(f.date) + '，內文日期 ' + esc(f.textDate) + '（核對以檔名日期為準）</div>';
  return h || '<div class="mut">冇更多資料</div>';
}
// 本站行動卡：由 /api/signals 嘅 historyAll 揀最新一張 Gemini 舊卡（gen≠v2）同最新一張 V2.0 生成器卡（gen=v2）
function ourRefs(list){
  const r = {}; (list || []).forEach(e => { if(e.gen === "v2") r.v2 = e; else r.main = e; });   // history 已按日期升序
  return r;
}
const mdOf = d => d ? d.slice(5).replace("-", "/") : "";
const refLine = (lab, e) => '<div>' + lab + '：<b>' + (e.stars ? "★".repeat(e.stars) + " " : "") + esc(e.rating || "—") + (typeof e.score === "number" ? " · " + e.score + " /100" : "") + '</b> · <span style="white-space:nowrap">' + esc(e.date) + '</span></div>';
const sameDayTag = (f, ref) => {   // 群友卡同本站卡日期唔同就唔好暗示可以直接比
  const ds = [["Gemini 舊卡", ref.main], ["V2.0", ref.v2]].filter(x => x[1]);
  if(!ds.length || !f.date) return "";
  const same = ds.filter(x => x[1].date === f.date), diff = ds.filter(x => x[1].date !== f.date);
  return (same.length ? '<span class="bd ok">同日比較：' + same.map(x => x[0]).join("、") + '</span>' : "") +
    (diff.length ? '<span class="bd diff">日期唔同（群友 ' + mdOf(f.date) + ' vs ' + diff.map(x => x[0] + " " + mdOf(x[1].date)).join("、") + '）</span>' : "");
};
const peerLine = (f, ref) => {
  const p = f.parsed || {}, scoreTxt = typeof p.score === "number" ? p.score + " " + esc(p.scoreScale || "") : "";
  return '<div class="pr"><div><span class="own">' + esc(f.signed ? f.owner : "未簽到") + '</span> <span class="mut">' + esc(f.date || "冇日期") + '</span> · ' +
    (p.stars ? "★".repeat(p.stars) + " " : "") + esc(p.rating || (f.image || f.err ? "" : "—")) + (scoreTxt ? " · " + scoreTxt : "") + '</div>' + (ref ? '<div>' + sameDayTag(f, ref) + '</div>' : '') + '<div>' + peerBadges(f) + '</div>' +
    '<div><a class="pdf" href="#" data-pdf="' + esc(f.id) + '">📄 PDF</a>' + (!f.image && !f.err ? '<button class="lnk" data-pd="' + esc(f.id) + '">' + (pr.open.has(f.id) ? "▲ 收起" : "▼ 今日動作／核對明細") + '</button>' : '') + '</div>' +
    (pr.open.has(f.id) ? peerDetail(f) : "") + '</div>';
};
const verdictOf = f => f.v ? f.v.verdict : "unk";
function renderPeer(){
  const el = $("#peer"); if(state.cat !== "peer") return;
  const note = '<div class="warnbox">⚠ 負責人＝簽到認領者，未必係實際製作者；核對只比對行情數字，唔代表分析對錯；唔入買賣訊號。<br>Gemini 舊卡由之前 Google Gemini 流程出，經抽查數字錯誤率高、評級普遍偏高，已唔入買賣訊號；V2.0 重算由本站生成器按日線重算；三者日期唔同時唔可直接比較。</div>';
  if(pr.err){ el.innerHTML = note + '<p class="note">⚠ ' + esc(pr.err) + '</p><button class="sm" id="prRetry">重試</button>'; $("#prRetry").onclick = () => loadPeers(false); return; }
  if(!pr.data){ el.innerHTML = note + '<p class="note">讀取中…</p>'; return; }
  const d = pr.data, st = d.state || {}, all = d.files.filter(f => mktOk(mktOf(f.ticker, f.name)));
  const cards = all.filter(f => f.kind === "card");
  const q = pr.q.trim().toLowerCase();
  const stat = (st.running ? "掃描中…" + (st.pending ? "（仲有 " + st.pending + " 份）" : "") : st.lastRun ? "最後掃描 " + hkTime(new Date(st.lastRun).toISOString()) + " HKT" : "未掃描") +
    " · " + cards.length + " 份行動卡 / 共 " + all.length + " 份檔案";
  let h = note + (st.err ? '<div class="warnbox">⚠ ' + esc(st.err) + '</div>' : '') + (d.ownersErr ? '<div class="warnbox">⚠ 簽到表讀取失敗，負責人可能唔齊：' + esc(d.ownersErr) + '</div>' : '') +
    '<div class="bar"><button class="sm' + (pr.view === "stock" ? " on" : "") + '" data-pv="stock">按股票</button><button class="sm' + (pr.view === "person" ? " on" : "") + '" data-pv="person">按人</button>' +
    '<input type="search" id="prQ" placeholder="搜尋股票代號／負責人" value="' + esc(pr.q) + '"><button class="sm" id="prRef"' + (st.running ? " disabled" : "") + '>🔄 重新掃描</button></div><div class="note">' + stat + '</div>';
  if(pr.view === "person"){
    const by = {}; cards.forEach(f => { const o = f.signed ? f.owner : "未簽到"; (by[o] ||= []).push(f); });
    const rowsP = Object.entries(by).filter(([o]) => !q || o.toLowerCase().includes(q)).map(([o, l]) => {
      const okN = l.filter(f => verdictOf(f) === "ok").length, wN = l.filter(f => verdictOf(f) === "warn").length, n = okN + wN;
      return {o, l, okN, wN, n, tickers:new Set(l.map(f => f.key)).size};
    }).sort((a, b) => b.l.length - a.l.length || a.o.localeCompare(b.o));
    h += '<table class="ppl"><tr><th>負責人</th><th>行動卡</th><th>股票</th><th>核對 ✓</th></tr>' + (rowsP.map(r =>
      '<tr><td>' + esc(r.o) + '</td><td>' + r.l.length + '</td><td>' + r.tickers + '</td><td>' + (r.n ? r.okN + "/" + r.n + "（" + Math.round(r.okN / r.n * 100) + "%）" + (r.n < 5 ? ' <span class="mut">樣本少</span>' : "") : '<span class="mut">未能核對</span>') + (r.wN ? ' <span class="mut">⚠' + r.wN + '</span>' : "") + '</td></tr>').join("") || '<tr><td colspan="4">冇資料</td></tr>') + '</table>' +
      '<div class="note">核對 ✓＝收市價／均線／成交量冇 ⚠（來源差異當 ✓）；攞唔到行情、圖像檔、抽唔到數字嘅唔計；少過 5 份標「樣本少」。「按人」嘅人名來自簽到表，只代表認領者。</div>';
  } else {
    const by = {}; all.forEach(f => { if(f.key) (by[f.key] ||= []).push(f); });
    const ours = {}; Object.entries(pr.ours || {}).forEach(([t, l]) => { ours[tkKey(t)] = ourRefs(l); });
    const groups = Object.entries(by).map(([k, l]) => ({k, l, tk:(l.find(f => f.kind === "card") || l[0]).ticker, cards:l.filter(f => f.kind === "card"), others:l.filter(f => f.kind !== "card")}))
      .filter(g => !q || g.tk.toLowerCase().includes(q) || g.l.some(f => (f.signed ? f.owner : "未簽到").toLowerCase().includes(q)))
      .sort((a, b) => ((b.cards.map(f => f.date).sort().pop()) || "").localeCompare((a.cards.map(f => f.date).sort().pop()) || "") || a.tk.localeCompare(b.tk));
    h += groups.map(g => {
      const o = ours[g.k] || {}, byOwner = {};
      g.cards.slice().sort((a, b) => b.date.localeCompare(a.date) || b.mt.localeCompare(a.mt)).forEach(f => { (byOwner[f.signed ? f.owner : "未簽到"] ||= []).push(f); });
      return '<div class="pc"><span class="tk">' + esc(g.tk) + '</span>' +
        '<div class="our">' + (o.main || o.v2 ? (o.main ? refLine("Gemini 舊卡（網站最新）", o.main) : "") + (o.v2 ? refLine("V2.0 重算", o.v2) : "") : (pr.ours ? "本站未有行動卡" : "讀取中…")) + '</div>' +
        (Object.values(byOwner).map(l => peerLine(l[0], o) + (l.length > 1 ? '<div class="mut">較舊 ' + (l.length - 1) + ' 份：' + l.slice(1).map(f => '<a href="#" data-pdf="' + esc(f.id) + '">' + esc(f.date || "冇日期") + '</a>').join("、") + '</div>' : "")).join("") || '<div class="mut">暫時冇群友行動卡</div>') +
        (g.others.length ? '<div class="mut" style="margin-top:4px">其他檔案：' + g.others.map(f => '<a href="#" data-pdf="' + esc(f.id) + '">' + ({stock:"本體報告", verify:"核對附錄"}[f.kind] || "其他") + " " + esc(f.date || "") + '</a>').join("、") + '</div>' : '') + '</div>';
    }).join("") || '<p class="note">冇資料。' + (st.running ? "" : "撳「重新掃描」讀取群友報告資料夾。") + '</p>';
    h += '<div class="note">每位負責人只顯示該股最新一份行動卡。收市價 ✓＝同行情收市價相符（容差 0.02 或 0.05%）；落後一日＝卡內收市價等於前一交易日收市；均線＝SMA 對行情重算（容差 0.05%）；成交量 ✓ ≤0.5%、來源差異 ≤3%、⚠ >3%；？＝攞唔到行情。</div>';
  }
  el.innerHTML = h;
  el.querySelectorAll("[data-pv]").forEach(b => b.onclick = () => { pr.view = b.dataset.pv; renderPeer(); });
  el.querySelectorAll("[data-pd]").forEach(b => b.onclick = () => { const i = b.dataset.pd; pr.open.has(i) ? pr.open.delete(i) : pr.open.add(i); renderPeer(); });
  el.querySelectorAll("[data-pdf]").forEach(a => a.onclick = async e => { e.preventDefault(); await openPeerPdf(a.dataset.pdf); });
  $("#prRef").onclick = () => loadPeers(true);
  const qi = $("#prQ"); qi.oninput = e => { pr.q = e.target.value; const p = e.target.selectionStart; renderPeer(); const n = $("#prQ"); n.focus(); n.setSelectionRange(p, p); };
}
async function openPeerPdf(id){   // PDF 要密碼：先取檔案再開 blob（先同步開視窗，避免被攔截）
  const w = window.open("", "_blank");
  try {
    const r = await fetch("/api/peers/pdf?id=" + encodeURIComponent(id), {headers:{"x-admin-password":state.pw}});
    if(r.status === 401){ lock(); throw new Error("密碼錯誤，已退出管理"); }
    if(!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
    const u = URL.createObjectURL(await r.blob());
    if(w) w.location = u; else location.href = u;
  } catch(e){ if(w) w.close(); toast("打開 PDF 失敗：" + e.message); }
}
const link0 = id => "https://drive.google.com/file/d/" + id + "/view";
(async () => {
  try {
    const j = await (await fetch("/api/hidden")).json();
    state.canDelete = !!j.canDelete; state.canUpload = !!j.canUpload; state.googleReady = !!j.googleReady; state.googleConnected = !!j.googleConnected; applyVis(j);
    if(new URLSearchParams(location.search).get("google") === "ok"){ history.replaceState(null, "", "/"); toast("已連接 Google"); }
    const pw = sessionStorage.getItem("jlaw-pw");
